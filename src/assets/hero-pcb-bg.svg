<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">Realistic PCB background</title>
  <desc id="desc">Decorative printed circuit board with realistic traces, vias, chips and connectors.</desc>
  <defs>
    <linearGradient id="boardSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7eef4"/>
      <stop offset="0.5" stop-color="#f3e7ef"/>
      <stop offset="1" stop-color="#f9f1f6"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ba7894"/>
      <stop offset="0.5" stop-color="#a96685"/>
      <stop offset="1" stop-color="#925d79"/>
    </linearGradient>
    <linearGradient id="copperSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4a2b7"/>
      <stop offset="1" stop-color="#b27895"/>
    </linearGradient>
    <filter id="boardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#c692aa" flood-opacity="0.16"/>
    </filter>
    <clipPath id="boardClip">
      <rect x="28" y="38" width="1384" height="824" rx="56"/>
    </clipPath>
    <pattern id="drillGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 H 0 V 80" fill="none" stroke="#c89ab0" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .trace {
        fill: none;
        stroke: url(#copper);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 5;
      }

      .trace.thin {
        stroke: url(#copperSoft);
        stroke-width: 3;
      }

      .via {
        fill: #fffafc;
        stroke: #9d6a86;
        stroke-width: 2.5;
      }

      .chip {
        fill: #fef9fc;
        stroke: #c190aa;
        stroke-width: 1.8;
      }

      .pin {
        stroke: #b37b96;
        stroke-width: 3;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <rect width="1440" height="900" fill="none"/>
  <rect x="28" y="38" width="1384" height="824" rx="56" fill="url(#boardSurface)" filter="url(#boardShadow)"/>
  <rect x="28" y="38" width="1384" height="824" rx="56" fill="none" stroke="#c287a2" stroke-opacity="0.38" stroke-width="2"/>
  <rect x="54" y="64" width="1332" height="772" rx="42" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.1"/>

  <g clip-path="url(#boardClip)">
    <rect width="1440" height="900" fill="url(#drillGrid)"/>

    <g opacity="0.94">
      <path class="trace" d="M 110 168 H 310 L 372 230 V 336 H 548 L 628 416 V 566 H 862 L 928 632 H 1174 V 742 H 1328"/>
      <path class="trace thin" d="M 126 444 H 264 L 338 370 V 246 H 494 L 564 176 H 734 V 250 L 820 336 H 1040 V 420 H 1262"/>
      <path class="trace" d="M 182 722 H 356 V 610 L 430 536 H 616 L 676 476 V 332 H 828 L 902 258 H 1118"/>
      <path class="trace thin" d="M 318 120 V 202 L 388 272 H 566 V 402 L 652 488 H 790 V 642 L 902 754"/>
      <path class="trace thin" d="M 1210 118 V 214 L 1142 282 H 1014 V 476 L 936 554 H 776"/>
      <path class="trace" d="M 104 594 H 230 L 298 662 H 470 L 530 722 H 682"/>
      <path class="trace thin" d="M 1088 676 H 980 L 924 620 H 812 V 544 L 760 492 H 658"/>
    </g>

    <g>
      <circle class="via" cx="310" cy="168" r="8"/>
      <circle class="via" cx="548" cy="336" r="8"/>
      <circle class="via" cx="862" cy="566" r="9"/>
      <circle class="via" cx="1174" cy="632" r="8"/>
      <circle class="via" cx="338" cy="370" r="7"/>
      <circle class="via" cx="734" cy="176" r="7"/>
      <circle class="via" cx="1040" cy="336" r="8"/>
      <circle class="via" cx="430" cy="536" r="8"/>
      <circle class="via" cx="828" cy="332" r="7"/>
      <circle class="via" cx="1142" cy="282" r="7"/>
      <circle class="via" cx="530" cy="722" r="7"/>
      <circle class="via" cx="812" cy="620" r="7"/>
    </g>

    <g>
      <rect class="chip" x="736" y="286" width="242" height="164" rx="18"/>
      <path class="pin" d="M 716 312 H 736 M 716 340 H 736 M 716 368 H 736 M 716 396 H 736 M 978 312 H 998 M 978 340 H 998 M 978 368 H 998 M 978 396 H 998"/>
      <path class="pin" d="M 772 266 V 286 M 808 266 V 286 M 844 266 V 286 M 880 266 V 286 M 916 266 V 286"/>
      <path class="pin" d="M 772 450 V 470 M 808 450 V 470 M 844 450 V 470 M 880 450 V 470 M 916 450 V 470"/>

      <rect class="chip" x="410" y="478" width="198" height="130" rx="16"/>
      <path class="pin" d="M 390 502 H 410 M 390 530 H 410 M 390 558 H 410 M 608 502 H 628 M 608 530 H 628 M 608 558 H 628"/>

      <rect class="chip" x="1082" y="162" width="170" height="112" rx="14"/>
      <path class="pin" d="M 1062 188 H 1082 M 1062 214 H 1082 M 1062 240 H 1082 M 1252 188 H 1272 M 1252 214 H 1272 M 1252 240 H 1272"/>
    </g>

    <g fill="#fbf6f9" stroke="#bb88a1" stroke-width="1.8">
      <rect x="136" y="138" width="92" height="28" rx="8"/>
      <rect x="1184" y="722" width="124" height="30" rx="8"/>
      <rect x="198" y="690" width="110" height="28" rx="8"/>
    </g>

    <g fill="#fffdfd" stroke="#b67b96" stroke-opacity="0.68" stroke-width="2.2">
      <circle cx="88" cy="98" r="14"/>
      <circle cx="1352" cy="98" r="14"/>
      <circle cx="88" cy="802" r="14"/>
      <circle cx="1352" cy="802" r="14"/>
    </g>
  </g>
</svg>
